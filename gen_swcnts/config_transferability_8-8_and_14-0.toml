# =============================================================================
# config_transferability_8-8_and_14-0.toml — CNT + Xe transferability-test set
# =============================================================================
# Part of the (8,8), (14,0), (10,0), (17,0) transferability-test group.
# This file covers (8,8) [armchair] and (14,0) [zigzag].
# See config_transferability_10-0_and_17-0.toml for the other two tubes.
#
# Usage:
#   python generate_cnt_xe.py config_transferability_8-8_and_14-0.toml
# =============================================================================


# -----------------------------------------------------------------------------
# Global physics and placement settings
# -----------------------------------------------------------------------------
[settings]

min_xe_c = 3.86
min_xe_xe = 4.32
max_attempts = 500000
narrow_radius_threshold = 5.0

# box_xy = 2 * radius + vacuum_padding
# Target Xe-wall periodic image gap: 15-20 A. Default 17 A gives:
#   (10,0) d=7.83  -> box=24.8 A  gap=17.0 A
#   (14,0) d=10.96 -> box=28.0 A  gap=17.0 A
#   (17,0) d=13.34 -> box=30.3 A  gap=17.0 A
#   (20,0) d=15.66 -> box=32.3 A  gap=17.0 A
#   (23,0) d=18.01 -> box=35.0 A  gap=17.0 A
vacuum_padding = 17.0

output_format = "extxyz"


# -----------------------------------------------------------------------------
# Reference CNT (used only for density fallback if n_xe is omitted per tube)
# -----------------------------------------------------------------------------
[reference]
n        = 7
m        = 6
num_units = 1
n_xe     = 6


[[tubes]]
n = 8
m = 8
num_units = 8
n_xe = 4
max_attempts = 500000

[[tubes]]
n = 14
m = 0
num_units = 5
n_xe = 4
max_attempts = 500000
